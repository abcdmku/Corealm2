<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0e0c09" />
    <title>Corealm</title>
    <link rel="stylesheet" href="./src/ui/styles.css" />
    <!-- After styles.css on purpose: the phone layout overrides the desktop rules by order. -->
    <link rel="stylesheet" href="./src/ui/styles/mobile.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="viewport"></canvas>
      <div id="ui-root"></div>
      <div id="boot-screen" role="status" aria-live="polite">
        <div class="boot-mark">COREALM</div>
        <div class="boot-status">Downloading the game...</div>
        <div class="boot-meter">
          <progress class="boot-progress" aria-label="Preparing the game" max="6" value="0"></progress>
          <span class="boot-activity" aria-hidden="true"></span>
        </div>
        <div class="boot-detail" aria-hidden="true">Preparing your starting area.</div>
      </div>
    </div>
    <!-- Feedback starts before the engine bundle is downloaded or evaluated. -->
    <script>
      (() => {
        performance.setResourceTimingBufferSize(4000);
        const started = performance.now();
        const timer = setInterval(() => {
          const screen = document.getElementById('boot-screen');
          if (!screen || screen.querySelector('.boot-error')) { clearInterval(timer); return; }
          const bytes = performance.getEntriesByType('resource').reduce((sum, entry) => sum + entry.encodedBodySize, 0);
          const seconds = Math.floor((performance.now() - started) / 1000);
          const detail = screen.querySelector('.boot-detail');
          const text = (bytes > 0 ? (bytes / 1000000).toFixed(1) + ' MB received · ' : '') + seconds + 's elapsed';
          if (detail && detail.textContent !== text) detail.textContent = text;
        }, 250);
      })();
    </script>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
