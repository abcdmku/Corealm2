<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" role="img" aria-labelledby="content-title content-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="content-title">The base game seeds a server, then a newer base can update it</title>
<desc id="content-desc">A centre column runs top to bottom: the base game&#39;s authored JSON under game/content/data in the repository; the compiler, which turns it into a client catalog and a server catalog under one revision hash; the server database, which holds that one server&#39;s own content; and the running worlds, where loot applies at the next kill, spawns at the next respawn and everything else at the next restart. A dashed arrow between the compiler and the database is labelled &#39;seeds an empty database, once&#39;: a deploy never overwrites a database that already has a catalog. On the left, devdocs in server mode publishes into that server&#39;s database, and a newer base game enters through &#39;update from base&#39;: preview, resolve conflicts, and apply. A marker-only update records history without swapping content. A muted note says export is a manual backup or reviewed promotion; nothing flows back automatically.</desc>
<style>
  svg {
    --surface: #f1f3f5;
    --surfaceMuted: #eceef0;
    --surfaceAccent: #dbe9f8;
    --surfaceSecondary: #d9efe8;
    --stroke: #3f4752;
    --strokeMuted: #5d6673;
    --text: #12161b;
    --textMuted: #3b434d;
    --accent: #0b57a4;
    --secondary: #0d6152;
  }
  @media (prefers-color-scheme: dark) {
    svg {
    --surface: #1a2029;
    --surfaceMuted: #181d25;
    --surfaceAccent: #152b44;
    --surfaceSecondary: #112b26;
    --stroke: #9aa5b2;
    --strokeMuted: #828d9b;
    --text: #e8eef5;
    --textMuted: #c2ccd8;
    --accent: #79bbff;
    --secondary: #5fd3a4;
    }
  }
</style>
<defs>
<marker id="head-neutral-adaptive" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,4.5 L0,9 Z" fill="var(--stroke)"/></marker>
<marker id="tail-neutral-adaptive" markerWidth="11" markerHeight="9" refX="1" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M11,0 L0,4.5 L11,9 Z" fill="var(--stroke)"/></marker>
<marker id="head-accent-adaptive" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,4.5 L0,9 Z" fill="var(--accent)"/></marker>
<marker id="tail-accent-adaptive" markerWidth="11" markerHeight="9" refX="1" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M11,0 L0,4.5 L11,9 Z" fill="var(--accent)"/></marker>
<marker id="head-secondary-adaptive" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,4.5 L0,9 Z" fill="var(--secondary)"/></marker>
<marker id="tail-secondary-adaptive" markerWidth="11" markerHeight="9" refX="1" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M11,0 L0,4.5 L11,9 Z" fill="var(--secondary)"/></marker>
<marker id="head-muted-adaptive" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,4.5 L0,9 Z" fill="var(--strokeMuted)"/></marker>
<marker id="tail-muted-adaptive" markerWidth="11" markerHeight="9" refX="1" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M11,0 L0,4.5 L11,9 Z" fill="var(--strokeMuted)"/></marker>
</defs>
<text data-owner="free" x="24" y="30" font-size="17" font-weight="600" fill="var(--text)">Content: seed once, then update from a newer base by review</text>
<g>
<rect data-box="authored" x="320" y="62" width="320" height="66" rx="8" fill="var(--surface)" stroke="var(--stroke)" stroke-width="1.6"/>
<text data-owner="authored" x="336" y="93" font-size="15" font-weight="600" fill="var(--text)">Base game JSON · repository</text>
<text data-owner="authored" x="336" y="114" font-size="13" fill="var(--textMuted)">game/content/data/*.json</text>
</g>
<g>
<rect data-box="compiler" x="320" y="166" width="320" height="100" rx="8" fill="var(--surface)" stroke="var(--stroke)" stroke-width="1.6"/>
<text data-owner="compiler" x="336" y="197" font-size="15" font-weight="600" fill="var(--text)">Compiler · compileCatalog()</text>
<text data-owner="compiler" x="336" y="218" font-size="13" fill="var(--textMuted)">One revision hash names two catalogs:</text>
<text data-owner="compiler" x="336" y="235" font-size="13" fill="var(--textMuted)">a small client catalog and the full</text>
<text data-owner="compiler" x="336" y="252" font-size="13" fill="var(--textMuted)">server catalog.</text>
</g>
<g>
<rect data-box="database" x="320" y="324" width="320" height="100" rx="8" fill="var(--surfaceAccent)" stroke="var(--accent)" stroke-width="2"/>
<text data-owner="database" x="336" y="355" font-size="15" font-weight="600" fill="var(--text)">Server database</text>
<text data-owner="database" x="336" y="376" font-size="13" fill="var(--textMuted)">This server&#39;s own sources, revisions</text>
<text data-owner="database" x="336" y="393" font-size="13" fill="var(--textMuted)">and base marker. Every base snapshot</text>
<text data-owner="database" x="336" y="410" font-size="13" fill="var(--textMuted)">needed for a later merge stays here.</text>
</g>
<g>
<rect data-box="worlds" x="320" y="478" width="320" height="83" rx="8" fill="var(--surfaceAccent)" stroke="var(--accent)" stroke-width="2"/>
<text data-owner="worlds" x="336" y="509" font-size="15" font-weight="600" fill="var(--text)">Running worlds</text>
<text data-owner="worlds" x="336" y="530" font-size="13" fill="var(--textMuted)">Loot: next kill. Spawns: next respawn.</text>
<text data-owner="worlds" x="336" y="547" font-size="13" fill="var(--textMuted)">Everything else: next restart.</text>
</g>
<g>
<rect data-box="devdocs" x="30" y="324" width="230" height="117" rx="8" fill="var(--surfaceAccent)" stroke="var(--accent)" stroke-width="2"/>
<text data-owner="devdocs" x="46" y="355" font-size="15" font-weight="600" fill="var(--text)">Devdocs, server mode</text>
<text data-owner="devdocs" x="46" y="376" font-size="13" fill="var(--textMuted)">Save all publishes to</text>
<text data-owner="devdocs" x="46" y="393" font-size="13" fill="var(--textMuted)">this server. Base game</text>
<text data-owner="devdocs" x="46" y="410" font-size="13" fill="var(--textMuted)">previews merge conflicts</text>
<text data-owner="devdocs" x="46" y="427" font-size="13" fill="var(--textMuted)">before apply.</text>
</g>
<g>
<rect data-box="newbase" x="672" y="62" width="258" height="83" rx="8" fill="var(--surfaceSecondary)" stroke="var(--secondary)" stroke-width="2"/>
<text data-owner="newbase" x="688" y="93" font-size="15" font-weight="600" fill="var(--text)">Newer base game</text>
<text data-owner="newbase" x="688" y="114" font-size="13" fill="var(--textMuted)">A release carries a version</text>
<text data-owner="newbase" x="688" y="131" font-size="13" fill="var(--textMuted)">and source snapshot.</text>
</g>
<g>
<rect data-box="update" x="672" y="184" width="258" height="117" rx="8" fill="var(--surfaceSecondary)" stroke="var(--secondary)" stroke-width="2"/>
<text data-owner="update" x="688" y="215" font-size="15" font-weight="600" fill="var(--text)">Update from base</text>
<text data-owner="update" x="688" y="236" font-size="13" fill="var(--textMuted)">Preview the three-way merge.</text>
<text data-owner="update" x="688" y="253" font-size="13" fill="var(--textMuted)">Resolve record conflicts.</text>
<text data-owner="update" x="688" y="270" font-size="13" fill="var(--textMuted)">Apply through the publish barrier.</text>
<text data-owner="update" x="688" y="287" font-size="13" fill="var(--textMuted)">No automatic update.</text>
</g>
<g>
<rect data-box="optional" x="672" y="374" width="258" height="100" rx="8" fill="var(--surfaceMuted)" stroke="var(--strokeMuted)" stroke-width="1.4"/>
<text data-owner="optional" x="688" y="405" font-size="15" font-weight="600" fill="var(--text)">Manual export</text>
<text data-owner="optional" x="688" y="426" font-size="13" fill="var(--textMuted)">Back up a server&#39;s content</text>
<text data-owner="optional" x="688" y="443" font-size="13" fill="var(--textMuted)">or promote a reviewed change</text>
<text data-owner="optional" x="688" y="460" font-size="13" fill="var(--textMuted)">into the base game.</text>
</g>
<path data-arrow="a-c" d="M480,128 V162" fill="none" stroke="var(--stroke)" stroke-width="2.1" marker-end="url(#head-neutral-adaptive)" stroke-linecap="round" stroke-linejoin="round"/>
<text data-owner="free" x="462" y="150" font-size="13" text-anchor="end" fill="var(--textMuted)">npm run content:compile</text>
<path data-arrow="c-d" d="M480,266 V320" fill="none" stroke="var(--stroke)" stroke-width="2.1" stroke-dasharray="7 5" marker-end="url(#head-neutral-adaptive)" stroke-linecap="round" stroke-linejoin="round"/>
<text data-owner="free" x="462" y="294" font-size="13" text-anchor="end" fill="var(--textMuted)">seeds an empty database, once</text>
<path data-arrow="d-w" d="M480,428 V474" fill="none" stroke="var(--accent)" stroke-width="2.1" marker-end="url(#head-accent-adaptive)" stroke-linecap="round" stroke-linejoin="round"/>
<text data-owner="free" x="500" y="454" font-size="13" text-anchor="start" fill="var(--accent)">the active revision</text>
<path data-arrow="dev-d" d="M260,362 H316" fill="none" stroke="var(--accent)" stroke-width="2.1" marker-end="url(#head-accent-adaptive)" stroke-linecap="round" stroke-linejoin="round"/>
<text data-owner="free" x="288" y="351" font-size="13" text-anchor="middle" fill="var(--accent)">publish</text>
<path data-arrow="base-update" d="M801,148 V180" fill="none" stroke="var(--secondary)" stroke-width="2.1" marker-end="url(#head-secondary-adaptive)" stroke-linecap="round" stroke-linejoin="round"/>
<path data-arrow="update-d" d="M670,242 H650 V374 H644" fill="none" stroke="var(--secondary)" stroke-width="2.1" marker-end="url(#head-secondary-adaptive)" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M30,668 H64" fill="none" stroke="var(--accent)" stroke-width="2"/>
<text data-owner="free" x="74" y="672" font-size="13" fill="var(--textMuted)">every publish, to this server</text>
<path d="M272.86,668 H306.86" fill="none" stroke="var(--stroke)" stroke-width="2" stroke-dasharray="7 5"/>
<text data-owner="free" x="316.86" y="672" font-size="13" fill="var(--textMuted)">once, when the database is empty</text>
</svg>
