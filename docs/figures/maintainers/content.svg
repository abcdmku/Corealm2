<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 592" width="960" height="592" role="img" aria-labelledby="content-title content-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="content-title">How content reaches the running game and comes back to the repository</title>
<desc id="content-desc">A centre column runs top to bottom: authored JSON under game/content/data; the compiler, which turns it into a client catalog and a server catalog under one revision hash; the live server database, which keeps every published revision and a pointer to the active one; and the running worlds, where loot applies at the next kill, spawns at the next respawn and everything else at the next restart. A dashed arrow marks the compiler seeding an empty database once. On the left, devdocs in server mode publishes into the database, and a rollback is a publish of an older revision. On the right, the content-export workflow reads the database and opens a pull request back onto the authored JSON.</desc>
<style>
  svg {
    --surface: #f1f3f5;
    --surfaceMuted: #eceef0;
    --surfaceAccent: #dbe9f8;
    --surfaceSecondary: #d9efe8;
    --stroke: #3f4752;
    --strokeMuted: #5d6673;
    --text: #12161b;
    --textMuted: #3b434d;
    --accent: #0b57a4;
    --secondary: #0d6152;
  }
  @media (prefers-color-scheme: dark) {
    svg {
    --surface: #1a2029;
    --surfaceMuted: #181d25;
    --surfaceAccent: #152b44;
    --surfaceSecondary: #112b26;
    --stroke: #9aa5b2;
    --strokeMuted: #828d9b;
    --text: #e8eef5;
    --textMuted: #c2ccd8;
    --accent: #79bbff;
    --secondary: #5fd3a4;
    }
  }
</style>
<defs>
<marker id="head-neutral-adaptive" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,4.5 L0,9 Z" fill="var(--stroke)"/></marker>
<marker id="tail-neutral-adaptive" markerWidth="11" markerHeight="9" refX="1" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M11,0 L0,4.5 L11,9 Z" fill="var(--stroke)"/></marker>
<marker id="head-accent-adaptive" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,4.5 L0,9 Z" fill="var(--accent)"/></marker>
<marker id="tail-accent-adaptive" markerWidth="11" markerHeight="9" refX="1" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M11,0 L0,4.5 L11,9 Z" fill="var(--accent)"/></marker>
<marker id="head-secondary-adaptive" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,4.5 L0,9 Z" fill="var(--secondary)"/></marker>
<marker id="tail-secondary-adaptive" markerWidth="11" markerHeight="9" refX="1" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M11,0 L0,4.5 L11,9 Z" fill="var(--secondary)"/></marker>
<marker id="head-muted-adaptive" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,4.5 L0,9 Z" fill="var(--strokeMuted)"/></marker>
<marker id="tail-muted-adaptive" markerWidth="11" markerHeight="9" refX="1" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M11,0 L0,4.5 L11,9 Z" fill="var(--strokeMuted)"/></marker>
</defs>
<text data-owner="free" x="24" y="30" font-size="17" font-weight="600" fill="var(--text)">Content: editor to running game, and back to the repository</text>
<g>
<rect data-box="authored" x="320" y="62" width="320" height="66" rx="8" fill="var(--surface)" stroke="var(--stroke)" stroke-width="1.6"/>
<text data-owner="authored" x="336" y="93" font-size="15" font-weight="600" fill="var(--text)">Authored JSON</text>
<text data-owner="authored" x="336" y="114" font-size="13" fill="var(--textMuted)">game/content/data/*.json</text>
</g>
<g>
<rect data-box="compiler" x="320" y="166" width="320" height="100" rx="8" fill="var(--surface)" stroke="var(--stroke)" stroke-width="1.6"/>
<text data-owner="compiler" x="336" y="197" font-size="15" font-weight="600" fill="var(--text)">Compiler · compileCatalog()</text>
<text data-owner="compiler" x="336" y="218" font-size="13" fill="var(--textMuted)">One revision hash names two catalogs:</text>
<text data-owner="compiler" x="336" y="235" font-size="13" fill="var(--textMuted)">a small client catalog and the full</text>
<text data-owner="compiler" x="336" y="252" font-size="13" fill="var(--textMuted)">server catalog.</text>
</g>
<g>
<rect data-box="database" x="320" y="314" width="320" height="83" rx="8" fill="var(--surfaceAccent)" stroke="var(--accent)" stroke-width="2"/>
<text data-owner="database" x="336" y="345" font-size="15" font-weight="600" fill="var(--text)">Live server database</text>
<text data-owner="database" x="336" y="366" font-size="13" fill="var(--textMuted)">Every published revision, and a</text>
<text data-owner="database" x="336" y="383" font-size="13" fill="var(--textMuted)">pointer to the active one.</text>
</g>
<g>
<rect data-box="worlds" x="320" y="446" width="320" height="83" rx="8" fill="var(--surfaceAccent)" stroke="var(--accent)" stroke-width="2"/>
<text data-owner="worlds" x="336" y="477" font-size="15" font-weight="600" fill="var(--text)">Running worlds</text>
<text data-owner="worlds" x="336" y="498" font-size="13" fill="var(--textMuted)">Loot: next kill. Spawns: next respawn.</text>
<text data-owner="worlds" x="336" y="515" font-size="13" fill="var(--textMuted)">Everything else: next restart.</text>
</g>
<g>
<rect data-box="devdocs" x="30" y="314" width="220" height="100" rx="8" fill="var(--surfaceAccent)" stroke="var(--accent)" stroke-width="2"/>
<text data-owner="devdocs" x="46" y="345" font-size="15" font-weight="600" fill="var(--text)">Devdocs, server mode</text>
<text data-owner="devdocs" x="46" y="366" font-size="13" fill="var(--textMuted)">Save all publishes.</text>
<text data-owner="devdocs" x="46" y="383" font-size="13" fill="var(--textMuted)">A rollback is a publish</text>
<text data-owner="devdocs" x="46" y="400" font-size="13" fill="var(--textMuted)">of an older revision.</text>
</g>
<g>
<rect data-box="export" x="710" y="314" width="220" height="100" rx="8" fill="var(--surface)" stroke="var(--stroke)" stroke-width="1.6"/>
<text data-owner="export" x="726" y="345" font-size="15" font-weight="600" fill="var(--text)">content-export.yml</text>
<text data-owner="export" x="726" y="366" font-size="13" fill="var(--textMuted)">Mondays and on demand.</text>
<text data-owner="export" x="726" y="383" font-size="13" fill="var(--textMuted)">Reads the live server&#39;s</text>
<text data-owner="export" x="726" y="400" font-size="13" fill="var(--textMuted)">source collections.</text>
</g>
<path data-arrow="a-c" d="M480,128 V162" fill="none" stroke="var(--stroke)" stroke-width="2.1" marker-end="url(#head-neutral-adaptive)" stroke-linecap="round" stroke-linejoin="round"/>
<text data-owner="free" x="462" y="150" font-size="13" text-anchor="end" fill="var(--textMuted)">npm run content:compile</text>
<path data-arrow="c-d" d="M480,266 V310" fill="none" stroke="var(--stroke)" stroke-width="2.1" stroke-dasharray="7 5" marker-end="url(#head-neutral-adaptive)" stroke-linecap="round" stroke-linejoin="round"/>
<text data-owner="free" x="462" y="292" font-size="13" text-anchor="end" fill="var(--textMuted)">seeds an empty database, once</text>
<path data-arrow="d-w" d="M480,397 V442" fill="none" stroke="var(--accent)" stroke-width="2.1" marker-end="url(#head-accent-adaptive)" stroke-linecap="round" stroke-linejoin="round"/>
<text data-owner="free" x="500" y="424" font-size="13" text-anchor="start" fill="var(--accent)">the active revision</text>
<path data-arrow="dev-d" d="M250,352 H316" fill="none" stroke="var(--accent)" stroke-width="2.1" marker-end="url(#head-accent-adaptive)" stroke-linecap="round" stroke-linejoin="round"/>
<text data-owner="free" x="283" y="341" font-size="13" text-anchor="middle" fill="var(--accent)">publish</text>
<path data-arrow="d-exp" d="M640,352 H706" fill="none" stroke="var(--stroke)" stroke-width="2.1" marker-end="url(#head-neutral-adaptive)" stroke-linecap="round" stroke-linejoin="round"/>
<text data-owner="free" x="673" y="341" font-size="13" text-anchor="middle" fill="var(--textMuted)">export</text>
<path data-arrow="exp-a" d="M820,314 V95 H644" fill="none" stroke="var(--stroke)" stroke-width="2.1" marker-end="url(#head-neutral-adaptive)" stroke-linecap="round" stroke-linejoin="round"/>
<text data-owner="free" x="806" y="200" font-size="13" text-anchor="end" fill="var(--textMuted)">opens a pull request</text>
<text data-owner="free" x="806" y="217" font-size="13" text-anchor="end" fill="var(--textMuted)">on content/live-export</text>
<path d="M30,556 H64" fill="none" stroke="var(--accent)" stroke-width="2"/>
<text data-owner="free" x="74" y="560" font-size="13" fill="var(--textMuted)">every publish</text>
<path d="M190.44,556 H224.44" fill="none" stroke="var(--stroke)" stroke-width="2" stroke-dasharray="7 5"/>
<text data-owner="free" x="234.44" y="560" font-size="13" fill="var(--textMuted)">once, when the database is empty</text>
</svg>
