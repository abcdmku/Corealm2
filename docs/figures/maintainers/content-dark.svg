<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 592" width="960" height="592" role="img" aria-labelledby="content-title content-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="content-title">How content reaches the running game and comes back to the repository</title>
<desc id="content-desc">A centre column runs top to bottom: authored JSON under game/content/data; the compiler, which turns it into a client catalog and a server catalog under one revision hash; the live server database, which keeps every published revision and a pointer to the active one; and the running worlds, where loot applies at the next kill, spawns at the next respawn and everything else at the next restart. A dashed arrow marks the compiler seeding an empty database once. On the left, devdocs in server mode publishes into the database, and a rollback is a publish of an older revision. On the right, the content-export workflow reads the database and opens a pull request back onto the authored JSON.</desc>
<defs>
<marker id="head-neutral-dark" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,4.5 L0,9 Z" fill="#9aa5b2"/></marker>
<marker id="tail-neutral-dark" markerWidth="11" markerHeight="9" refX="1" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M11,0 L0,4.5 L11,9 Z" fill="#9aa5b2"/></marker>
<marker id="head-accent-dark" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,4.5 L0,9 Z" fill="#79bbff"/></marker>
<marker id="tail-accent-dark" markerWidth="11" markerHeight="9" refX="1" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M11,0 L0,4.5 L11,9 Z" fill="#79bbff"/></marker>
<marker id="head-secondary-dark" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,4.5 L0,9 Z" fill="#5fd3a4"/></marker>
<marker id="tail-secondary-dark" markerWidth="11" markerHeight="9" refX="1" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M11,0 L0,4.5 L11,9 Z" fill="#5fd3a4"/></marker>
<marker id="head-muted-dark" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,4.5 L0,9 Z" fill="#828d9b"/></marker>
<marker id="tail-muted-dark" markerWidth="11" markerHeight="9" refX="1" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M11,0 L0,4.5 L11,9 Z" fill="#828d9b"/></marker>
</defs>
<text data-owner="free" x="24" y="30" font-size="17" font-weight="600" fill="#e8eef5">Content: editor to running game, and back to the repository</text>
<g>
<rect data-box="authored" x="320" y="62" width="320" height="66" rx="8" fill="#1a2029" stroke="#9aa5b2" stroke-width="1.6"/>
<text data-owner="authored" x="336" y="93" font-size="15" font-weight="600" fill="#e8eef5">Authored JSON</text>
<text data-owner="authored" x="336" y="114" font-size="13" fill="#c2ccd8">game/content/data/*.json</text>
</g>
<g>
<rect data-box="compiler" x="320" y="166" width="320" height="100" rx="8" fill="#1a2029" stroke="#9aa5b2" stroke-width="1.6"/>
<text data-owner="compiler" x="336" y="197" font-size="15" font-weight="600" fill="#e8eef5">Compiler · compileCatalog()</text>
<text data-owner="compiler" x="336" y="218" font-size="13" fill="#c2ccd8">One revision hash names two catalogs:</text>
<text data-owner="compiler" x="336" y="235" font-size="13" fill="#c2ccd8">a small client catalog and the full</text>
<text data-owner="compiler" x="336" y="252" font-size="13" fill="#c2ccd8">server catalog.</text>
</g>
<g>
<rect data-box="database" x="320" y="314" width="320" height="83" rx="8" fill="#152b44" stroke="#79bbff" stroke-width="2"/>
<text data-owner="database" x="336" y="345" font-size="15" font-weight="600" fill="#e8eef5">Live server database</text>
<text data-owner="database" x="336" y="366" font-size="13" fill="#c2ccd8">Every published revision, and a</text>
<text data-owner="database" x="336" y="383" font-size="13" fill="#c2ccd8">pointer to the active one.</text>
</g>
<g>
<rect data-box="worlds" x="320" y="446" width="320" height="83" rx="8" fill="#152b44" stroke="#79bbff" stroke-width="2"/>
<text data-owner="worlds" x="336" y="477" font-size="15" font-weight="600" fill="#e8eef5">Running worlds</text>
<text data-owner="worlds" x="336" y="498" font-size="13" fill="#c2ccd8">Loot: next kill. Spawns: next respawn.</text>
<text data-owner="worlds" x="336" y="515" font-size="13" fill="#c2ccd8">Everything else: next restart.</text>
</g>
<g>
<rect data-box="devdocs" x="30" y="314" width="220" height="100" rx="8" fill="#152b44" stroke="#79bbff" stroke-width="2"/>
<text data-owner="devdocs" x="46" y="345" font-size="15" font-weight="600" fill="#e8eef5">Devdocs, server mode</text>
<text data-owner="devdocs" x="46" y="366" font-size="13" fill="#c2ccd8">Save all publishes.</text>
<text data-owner="devdocs" x="46" y="383" font-size="13" fill="#c2ccd8">A rollback is a publish</text>
<text data-owner="devdocs" x="46" y="400" font-size="13" fill="#c2ccd8">of an older revision.</text>
</g>
<g>
<rect data-box="export" x="710" y="314" width="220" height="100" rx="8" fill="#1a2029" stroke="#9aa5b2" stroke-width="1.6"/>
<text data-owner="export" x="726" y="345" font-size="15" font-weight="600" fill="#e8eef5">content-export.yml</text>
<text data-owner="export" x="726" y="366" font-size="13" fill="#c2ccd8">Mondays and on demand.</text>
<text data-owner="export" x="726" y="383" font-size="13" fill="#c2ccd8">Reads the live server&#39;s</text>
<text data-owner="export" x="726" y="400" font-size="13" fill="#c2ccd8">source collections.</text>
</g>
<path data-arrow="a-c" d="M480,128 V162" fill="none" stroke="#9aa5b2" stroke-width="2.1" marker-end="url(#head-neutral-dark)" stroke-linecap="round" stroke-linejoin="round"/>
<text data-owner="free" x="462" y="150" font-size="13" text-anchor="end" fill="#c2ccd8">npm run content:compile</text>
<path data-arrow="c-d" d="M480,266 V310" fill="none" stroke="#9aa5b2" stroke-width="2.1" stroke-dasharray="7 5" marker-end="url(#head-neutral-dark)" stroke-linecap="round" stroke-linejoin="round"/>
<text data-owner="free" x="462" y="292" font-size="13" text-anchor="end" fill="#c2ccd8">seeds an empty database, once</text>
<path data-arrow="d-w" d="M480,397 V442" fill="none" stroke="#79bbff" stroke-width="2.1" marker-end="url(#head-accent-dark)" stroke-linecap="round" stroke-linejoin="round"/>
<text data-owner="free" x="500" y="424" font-size="13" text-anchor="start" fill="#79bbff">the active revision</text>
<path data-arrow="dev-d" d="M250,352 H316" fill="none" stroke="#79bbff" stroke-width="2.1" marker-end="url(#head-accent-dark)" stroke-linecap="round" stroke-linejoin="round"/>
<text data-owner="free" x="283" y="341" font-size="13" text-anchor="middle" fill="#79bbff">publish</text>
<path data-arrow="d-exp" d="M640,352 H706" fill="none" stroke="#9aa5b2" stroke-width="2.1" marker-end="url(#head-neutral-dark)" stroke-linecap="round" stroke-linejoin="round"/>
<text data-owner="free" x="673" y="341" font-size="13" text-anchor="middle" fill="#c2ccd8">export</text>
<path data-arrow="exp-a" d="M820,314 V95 H644" fill="none" stroke="#9aa5b2" stroke-width="2.1" marker-end="url(#head-neutral-dark)" stroke-linecap="round" stroke-linejoin="round"/>
<text data-owner="free" x="806" y="200" font-size="13" text-anchor="end" fill="#c2ccd8">opens a pull request</text>
<text data-owner="free" x="806" y="217" font-size="13" text-anchor="end" fill="#c2ccd8">on content/live-export</text>
<path d="M30,556 H64" fill="none" stroke="#79bbff" stroke-width="2"/>
<text data-owner="free" x="74" y="560" font-size="13" fill="#c2ccd8">every publish</text>
<path d="M190.44,556 H224.44" fill="none" stroke="#9aa5b2" stroke-width="2" stroke-dasharray="7 5"/>
<text data-owner="free" x="234.44" y="560" font-size="13" fill="#c2ccd8">once, when the database is empty</text>
</svg>
