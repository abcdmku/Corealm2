<marker id="head-accent-adaptive" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,4.5 L0,9 Z" fill="var(--accent)"/></marker>
<marker id="tail-accent-adaptive" markerWidth="11" markerHeight="9" refX="1" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M11,0 L0,4.5 L11,9 Z" fill="var(--accent)"/></marker>
<marker id="head-secondary-adaptive" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,4.5 L0,9 Z" fill="var(--secondary)"/></marker>
<marker id="tail-secondary-adaptive" markerWidth="11" markerHeight="9" refX="1" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M11,0 L0,4.5 L11,9 Z" fill="var(--secondary)"/></marker>
<marker id="head-muted-adaptive" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,4.5 L0,9 Z" fill="var(--strokeMuted)"/></marker>
<marker id="tail-muted-adaptive" markerWidth="11" markerHeight="9" refX="1" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M11,0 L0,4.5 L11,9 Z" fill="var(--strokeMuted)"/></marker>
</defs>
<text data-owner="free" x="24" y="30" font-size="17" font-weight="600" fill="var(--text)">Environments and what triggers what</text>
<text data-owner="free" x="30" y="62" font-size="13" font-weight="600" letter-spacing="0.09em" fill="var(--textMuted)">1 · LOCAL DEV</text>
<text data-owner="free" x="330" y="62" font-size="13" font-weight="600" letter-spacing="0.09em" fill="var(--textMuted)">2 · CI ON GITHUB</text>
<text data-owner="free" x="670" y="62" font-size="13" font-weight="600" letter-spacing="0.09em" fill="var(--textMuted)">3 · DEPLOYED</text>
<g>
<rect data-box="local0" x="30" y="76" width="250" height="66" rx="8" fill="var(--surface)" stroke="var(--stroke)" stroke-width="1.6"/>
<text data-owner="local0" x="46" y="107" font-size="15" font-weight="600" fill="var(--text)">npm run dev</text>
<text data-owner="local0" x="46" y="128" font-size="13" fill="var(--textMuted)">The game on 127.0.0.1:4173.</text>
</g>
<g>
<rect data-box="local1" x="30" y="168" width="250" height="66" rx="8" fill="var(--surface)" stroke="var(--stroke)" stroke-width="1.6"/>
<text data-owner="local1" x="46" y="199" font-size="15" font-weight="600" fill="var(--text)">npm run devdocs</text>
<text data-owner="local1" x="46" y="220" font-size="13" fill="var(--textMuted)">The editor, repo mode.</text>
</g>
<g>
<rect data-box="local2" x="30" y="260" width="250" height="66" rx="8" fill="var(--surface)" stroke="var(--stroke)" stroke-width="1.6"/>
<text data-owner="local2" x="46" y="291" font-size="15" font-weight="600" fill="var(--text)">npm run identity</text>
<text data-owner="local2" x="46" y="312" font-size="13" fill="var(--textMuted)">Accounts on 127.0.0.1:4190.</text>
</g>
<g>
<rect data-box="local3" x="30" y="352" width="250" height="66" rx="8" fill="var(--surface)" stroke="var(--stroke)" stroke-width="1.6"/>
<text data-owner="local3" x="46" y="383" font-size="15" font-weight="600" fill="var(--text)">npm run multiplayer:server</text>
<text data-owner="local3" x="46" y="404" font-size="13" fill="var(--textMuted)">Loopback guests for testing.</text>
</g>
<g>
<rect data-box="trigger" x="30" y="444" width="250" height="83" rx="8" fill="var(--surfaceMuted)" stroke="var(--strokeMuted)" stroke-width="1.4"/>
<text data-owner="trigger" x="46" y="475" font-size="15" font-weight="600" fill="var(--text)">Then push</text>
<text data-owner="trigger" x="46" y="496" font-size="13" fill="var(--textMuted)">A push, a pull request or a</text>
<text data-owner="trigger" x="46" y="513" font-size="13" fill="var(--textMuted)">v* tag starts the workflows.</text>
</g>
<g>
<rect data-box="docs" x="330" y="76" width="290" height="100" rx="8" fill="var(--surfaceAccent)" stroke="var(--accent)" stroke-width="2"/>
<text data-owner="docs" x="346" y="107" font-size="15" font-weight="600" fill="var(--text)">docs.yml · Game and guide</text>
<text data-owner="docs" x="346" y="128" font-size="13" fill="var(--textMuted)">On a pull request: check and labs. The</text>
<text data-owner="docs" x="346" y="145" font-size="13" fill="var(--textMuted)">smoke test needs a GPU runner.</text>
<text data-owner="docs" x="346" y="162" font-size="13" fill="var(--textMuted)">On main: deploy the client and guide.</text>
</g>
<g>
<rect data-box="cexport" x="330" y="202" width="290" height="83" rx="8" fill="var(--surface)" stroke="var(--stroke)" stroke-width="1.6"/>
<text data-owner="cexport" x="346" y="233" font-size="15" font-weight="600" fill="var(--text)">content-export.yml</text>
<text data-owner="cexport" x="346" y="254" font-size="13" fill="var(--textMuted)">Manual. Backs up or promotes one</text>
<text data-owner="cexport" x="346" y="271" font-size="13" fill="var(--textMuted)">server&#39;s content as a pull request.</text>
</g>
<g>
<rect data-box="cpublish" x="330" y="311" width="290" height="83" rx="8" fill="var(--surface)" stroke="var(--stroke)" stroke-width="1.6"/>
<text data-owner="cpublish" x="346" y="342" font-size="15" font-weight="600" fill="var(--text)">content-publish.yml</text>
<text data-owner="cpublish" x="346" y="363" font-size="13" fill="var(--textMuted)">Manual. Pushes a checkout&#39;s content to</text>
<text data-owner="cpublish" x="346" y="380" font-size="13" fill="var(--textMuted)">a server you administer, after approval.</text>
</g>
<g>
<rect data-box="release" x="330" y="420" width="290" height="83" rx="8" fill="var(--surfaceAccent)" stroke="var(--accent)" stroke-width="2"/>
<text data-owner="release" x="346" y="451" font-size="15" font-weight="600" fill="var(--text)">release.yml · Server release</text>
<text data-owner="release" x="346" y="472" font-size="13" fill="var(--textMuted)">On a v* tag: build both executables</text>
<text data-owner="release" x="346" y="489" font-size="13" fill="var(--textMuted)">and attach them to a release.</text>
</g>
<g>
<rect data-box="selftest" x="330" y="529" width="290" height="83" rx="8" fill="var(--surfaceMuted)" stroke="var(--strokeMuted)" stroke-width="1.4"/>
<text data-owner="selftest" x="346" y="560" font-size="15" font-weight="600" fill="var(--text)">content-selftest.yml</text>
<text data-owner="selftest" x="346" y="581" font-size="13" fill="var(--textMuted)">On pushes to the content tooling.</text>
<text data-owner="selftest" x="346" y="598" font-size="13" fill="var(--textMuted)">Proves the tools work, no secrets.</text>
</g>
<g>
<rect data-box="assethost" x="670" y="76" width="260" height="83" rx="8" fill="var(--surfaceMuted)" stroke="var(--strokeMuted)" stroke-width="1.4"/>
<text data-owner="assethost" x="686" y="107" font-size="15" font-weight="600" fill="var(--text)">Asset host</text>
<text data-owner="assethost" x="686" y="128" font-size="13" fill="var(--textMuted)">GitHub Pages by default.</text>
<text data-owner="assethost" x="686" y="145" font-size="13" fill="var(--textMuted)">Client build, models, world.</text>
</g>
<g>
<rect data-box="gameserver" x="670" y="202" width="260" height="192" rx="8" fill="var(--surfaceAccent)" stroke="var(--accent)" stroke-width="2"/>
<text data-owner="gameserver" x="686" y="233" font-size="15" font-weight="600" fill="var(--text)">Game server</text>
<text data-owner="gameserver" x="686" y="254" font-size="13" fill="var(--textMuted)">The executable behind a reverse</text>
<text data-owner="gameserver" x="686" y="271" font-size="13" fill="var(--textMuted)">proxy that holds the TLS</text>
<text data-owner="gameserver" x="686" y="288" font-size="13" fill="var(--textMuted)">certificate. One per host.</text>
<text data-owner="gameserver" x="686" y="322" font-size="13" fill="var(--textMuted)">The owner runs a test server</text>
<text data-owner="gameserver" x="686" y="339" font-size="13" fill="var(--textMuted)">the same way.</text>
</g>
<g>
<rect data-box="ghrelease" x="670" y="420" width="260" height="83" rx="8" fill="var(--surfaceMuted)" stroke="var(--strokeMuted)" stroke-width="1.4"/>
<text data-owner="ghrelease" x="686" y="451" font-size="15" font-weight="600" fill="var(--text)">GitHub release</text>
<text data-owner="ghrelease" x="686" y="472" font-size="13" fill="var(--textMuted)">corealm-server-win-x64.exe,</text>
<text data-owner="ghrelease" x="686" y="489" font-size="13" fill="var(--textMuted)">corealm-server-linux-x64.</text>
</g>
<g>
<rect data-box="identitydeploy" x="670" y="529" width="260" height="83" rx="8" fill="var(--surface)" stroke="var(--stroke)" stroke-width="1.6"/>
<text data-owner="identitydeploy" x="686" y="560" font-size="15" font-weight="600" fill="var(--text)">Identity service</text>
<text data-owner="identitydeploy" x="686" y="581" font-size="13" fill="var(--textMuted)">Deployed by hand, behind HTTPS.</text>
<text data-owner="identitydeploy" x="686" y="598" font-size="13" fill="var(--textMuted)">It holds the signing keys.</text>
</g>
<path data-arrow="docs-assets" d="M622,118 H666" fill="none" stroke="var(--accent)" stroke-width="2.1" marker-end="url(#head-accent-adaptive)" stroke-linecap="round" stroke-linejoin="round"/>
<text data-owner="free" x="644" y="138" font-size="13" text-anchor="middle" fill="var(--accent)">deploy</text>
<path data-arrow="server-export" d="M666,244 H624" fill="none" stroke="var(--stroke)" stroke-width="2.1" stroke-dasharray="7 5" marker-end="url(#head-neutral-adaptive)" stroke-linecap="round" stroke-linejoin="round"/>
<text data-owner="free" x="644" y="264" font-size="13" text-anchor="middle" fill="var(--textMuted)">read</text>
<path data-arrow="publish-server" d="M622,353 H666" fill="none" stroke="var(--stroke)" stroke-width="2.1" stroke-dasharray="7 5" marker-end="url(#head-neutral-adaptive)" stroke-linecap="round" stroke-linejoin="round"/>
<text data-owner="free" x="644" y="373" font-size="13" text-anchor="middle" fill="var(--textMuted)">send</text>
<path data-arrow="release-gh" d="M622,462 H666" fill="none" stroke="var(--accent)" stroke-width="2.1" marker-end="url(#head-accent-adaptive)" stroke-linecap="round" stroke-linejoin="round"/>
<text data-owner="free" x="644" y="482" font-size="13" text-anchor="middle" fill="var(--accent)">build</text>
<g>
<rect data-box="secrets" x="30" y="644" width="900" height="83" rx="8" fill="var(--surfaceMuted)" stroke="var(--strokeMuted)" stroke-width="1.4"/>
<text data-owner="secrets" x="46" y="675" font-size="15" font-weight="600" fill="var(--text)">Where secrets live</text>
<text data-owner="secrets" x="46" y="696" font-size="13" fill="var(--textMuted)">The game server&#39;s own database (admin sessions, API tokens), the identity service&#39;s environment, and GitHub secrets.</text>
<text data-owner="secrets" x="46" y="713" font-size="13" fill="var(--textMuted)">A static build never holds one. The content workflows read their token from the environment, never a command line.</text>
</g>
<path d="M30,758 H64" fill="none" stroke="var(--accent)" stroke-width="2"/>
<text data-owner="free" x="74" y="762" font-size="13" fill="var(--textMuted)">automatic on its trigger</text>
<path d="M243.99999999999997,758 H278" fill="none" stroke="var(--stroke)" stroke-width="2" stroke-dasharray="7 5"/>
<text data-owner="free" x="288" y="762" font-size="13" fill="var(--textMuted)">manual, or waits for an approval</text>
</svg>
