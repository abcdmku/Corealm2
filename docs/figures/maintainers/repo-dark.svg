<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 556" width="960" height="556" role="img" aria-labelledby="repo-title repo-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="repo-title">The repository, folder by folder</title>
<desc id="repo-desc">Nine top-level folders with one line each: game, devdocs, identity, tools, tests, docs, deploy, art and runs. A wide box underneath names the four files to read first: docs/live-server-plan.md, docs/multiplayer-hosting.md, game/src/contracts.ts with game/src/multiplayer/worldHost.ts, and the scripts block of package.json.</desc>
<defs>
<marker id="head-neutral-dark" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,4.5 L0,9 Z" fill="#9aa5b2"/></marker>
<marker id="tail-neutral-dark" markerWidth="11" markerHeight="9" refX="1" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M11,0 L0,4.5 L11,9 Z" fill="#9aa5b2"/></marker>
<marker id="head-accent-dark" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,4.5 L0,9 Z" fill="#79bbff"/></marker>
<marker id="tail-accent-dark" markerWidth="11" markerHeight="9" refX="1" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M11,0 L0,4.5 L11,9 Z" fill="#79bbff"/></marker>
<marker id="head-secondary-dark" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,4.5 L0,9 Z" fill="#5fd3a4"/></marker>
<marker id="tail-secondary-dark" markerWidth="11" markerHeight="9" refX="1" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M11,0 L0,4.5 L11,9 Z" fill="#5fd3a4"/></marker>
<marker id="head-muted-dark" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,4.5 L0,9 Z" fill="#828d9b"/></marker>
<marker id="tail-muted-dark" markerWidth="11" markerHeight="9" refX="1" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M11,0 L0,4.5 L11,9 Z" fill="#828d9b"/></marker>
</defs>
<text data-owner="free" x="24" y="30" font-size="17" font-weight="600" fill="#e8eef5">The repository</text>
<g>
<rect data-box="folder0" x="30" y="60" width="290" height="83" rx="8" fill="#1a2029" stroke="#9aa5b2" stroke-width="1.6"/>
<text data-owner="folder0" x="46" y="91" font-size="15" font-weight="600" fill="#e8eef5">game/</text>
<text data-owner="folder0" x="46" y="112" font-size="13" fill="#c2ccd8">Client, simulation, the multiplayer</text>
<text data-owner="folder0" x="46" y="129" font-size="13" fill="#c2ccd8">host core, compiler, authored JSON.</text>
</g>
<g>
<rect data-box="folder1" x="335" y="60" width="290" height="83" rx="8" fill="#1a2029" stroke="#9aa5b2" stroke-width="1.6"/>
<text data-owner="folder1" x="351" y="91" font-size="15" font-weight="600" fill="#e8eef5">devdocs/</text>
<text data-owner="folder1" x="351" y="112" font-size="13" fill="#c2ccd8">The editor and admin UI. React and</text>
<text data-owner="folder1" x="351" y="129" font-size="13" fill="#c2ccd8">Vite. Repo mode and server mode.</text>
</g>
<g>
<rect data-box="folder2" x="640" y="60" width="290" height="83" rx="8" fill="#1a2029" stroke="#9aa5b2" stroke-width="1.6"/>
<text data-owner="folder2" x="656" y="91" font-size="15" font-weight="600" fill="#e8eef5">identity/</text>
<text data-owner="folder2" x="656" y="112" font-size="13" fill="#c2ccd8">The accounts service: usernames,</text>
<text data-owner="folder2" x="656" y="129" font-size="13" fill="#c2ccd8">passwords, join tokens, directory.</text>
</g>
<g>
<rect data-box="folder3" x="30" y="172" width="290" height="83" rx="8" fill="#1a2029" stroke="#9aa5b2" stroke-width="1.6"/>
<text data-owner="folder3" x="46" y="203" font-size="15" font-weight="600" fill="#e8eef5">tools/</text>
<text data-owner="folder3" x="46" y="224" font-size="13" fill="#c2ccd8">Every entry point npm run calls:</text>
<text data-owner="folder3" x="46" y="241" font-size="13" fill="#c2ccd8">servers, builds, bakes, probes.</text>
</g>
<g>
<rect data-box="folder4" x="335" y="172" width="290" height="83" rx="8" fill="#1a2029" stroke="#9aa5b2" stroke-width="1.6"/>
<text data-owner="folder4" x="351" y="203" font-size="15" font-weight="600" fill="#e8eef5">tests/</text>
<text data-owner="folder4" x="351" y="224" font-size="13" fill="#c2ccd8">The vitest suite. npm test runs it,</text>
<text data-owner="folder4" x="351" y="241" font-size="13" fill="#c2ccd8">npm run check runs it with builds.</text>
</g>
<g>
<rect data-box="folder5" x="640" y="172" width="290" height="83" rx="8" fill="#1a2029" stroke="#9aa5b2" stroke-width="1.6"/>
<text data-owner="folder5" x="656" y="203" font-size="15" font-weight="600" fill="#e8eef5">docs/</text>
<text data-owner="folder5" x="656" y="224" font-size="13" fill="#c2ccd8">These documents, and the generated</text>
<text data-owner="folder5" x="656" y="241" font-size="13" fill="#c2ccd8">player guide under docs/game/.</text>
</g>
<g>
<rect data-box="folder6" x="30" y="284" width="290" height="83" rx="8" fill="#1a2029" stroke="#9aa5b2" stroke-width="1.6"/>
<text data-owner="folder6" x="46" y="315" font-size="15" font-weight="600" fill="#e8eef5">deploy/</text>
<text data-owner="folder6" x="46" y="336" font-size="13" fill="#c2ccd8">The systemd unit that runs the</text>
<text data-owner="folder6" x="46" y="353" font-size="13" fill="#c2ccd8">Linux server executable.</text>
</g>
<g>
<rect data-box="folder7" x="335" y="284" width="290" height="83" rx="8" fill="#1a2029" stroke="#9aa5b2" stroke-width="1.6"/>
<text data-owner="folder7" x="351" y="315" font-size="15" font-weight="600" fill="#e8eef5">art/</text>
<text data-owner="folder7" x="351" y="336" font-size="13" fill="#c2ccd8">Source art and the inputs that</text>
<text data-owner="folder7" x="351" y="353" font-size="13" fill="#c2ccd8">generate models, icons, textures.</text>
</g>
<g>
<rect data-box="folder8" x="640" y="284" width="290" height="83" rx="8" fill="#1a2029" stroke="#9aa5b2" stroke-width="1.6"/>
<text data-owner="folder8" x="656" y="315" font-size="15" font-weight="600" fill="#e8eef5">runs/</text>
<text data-owner="folder8" x="656" y="336" font-size="13" fill="#c2ccd8">Per-build planning and review</text>
<text data-owner="folder8" x="656" y="353" font-size="13" fill="#c2ccd8">notes. Nothing ships from here.</text>
</g>
<g>
<rect data-box="first" x="30" y="408" width="900" height="117" rx="8" fill="#152b44" stroke="#79bbff" stroke-width="2"/>
<text data-owner="first" x="46" y="439" font-size="15" font-weight="600" fill="#e8eef5">Read these first</text>
<text data-owner="first" x="46" y="460" font-size="13" fill="#c2ccd8">docs/live-server-plan.md: the architecture and the milestones. Its Build notes section records deviations.</text>
<text data-owner="first" x="46" y="477" font-size="13" fill="#c2ccd8">docs/multiplayer-hosting.md: running a server: configuration, the admin API, publishing, releases.</text>
<text data-owner="first" x="46" y="494" font-size="13" fill="#c2ccd8">game/src/contracts.ts holds the shared types. game/src/multiplayer/worldHost.ts is the host core.</text>
<text data-owner="first" x="46" y="511" font-size="13" fill="#c2ccd8">package.json: the scripts block is every command in this document.</text>
</g>
</svg>
