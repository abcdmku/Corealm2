name: Content export

# A backup and promotion tool. It is not part of any normal loop, and it runs only when a human
# starts it.
#
# The repository holds the base game, which seeds a new server's database once. After that the
# server's database is that server's content, and nothing flows back on its own. This workflow does
# one deliberate thing: it reads one configured server's source collections into
# `game/content/data/` and opens a pull request that a human must merge. Use it to back up or
# version a server you own, or to promote a change you made on your own server into the base game.
# Merging the pull request changes the base game for every server seeded after it and changes
# nothing on a server already running. A server cannot start this workflow, and it never publishes:
# the token it uses is `content:read`.
#
# Configure it once, per `docs/multiplayer-hosting.md` → "Content workflows and their secrets":
#   repository variable COREALM_SERVER_URL      the server to export from, e.g. https://play.example.com/
#   repository secret   COREALM_CONTENT_READ_TOKEN   a cat_… token with the content:read scope
# Without both it skips with a notice, so a fork never fails red.

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "Server to export from. Defaults to the COREALM_SERVER_URL repository variable."
        required: false
        type: string
  # TEMPORARY, remove when live-server merges to main: workflow_dispatch only works from the default
  # branch, so touching .github/export-now on this branch runs an export against it.
  push:
    branches: [live-server]
    paths: ['.github/export-now']

permissions: {}

concurrency:
  # Two exports would force-push the same branch over each other.
  group: content-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    # The world bake, and a navigation bake when an export moves geometry, run inside this job.
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Is this repository configured for exports
        id: configured
        env:
          SERVER_URL: ${{ inputs.server_url || vars.COREALM_SERVER_URL }}
          HAS_TOKEN: ${{ secrets.COREALM_CONTENT_READ_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ -z "${SERVER_URL}" ] || [ "${HAS_TOKEN}" != "true" ]; then
            echo "::notice title=Content export skipped::No live server is configured. Set the COREALM_SERVER_URL repository variable and the COREALM_CONTENT_READ_TOKEN secret to enable it. See docs/multiplayer-hosting.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "${SERVER_URL}" in
            https://*) ;;
            *) echo "::error title=Bad server URL::COREALM_SERVER_URL must be an https URL."; exit 1 ;;
          esac
          case "${SERVER_URL}" in
            *[!-A-Za-z0-9._~:/?@!\$\&\'\(\)\*\+,\;=%]*) echo "::error title=Bad server URL::COREALM_SERVER_URL holds a character a URL may not."; exit 1 ;;
          esac
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "server_url=${SERVER_URL}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: steps.configured.outputs.ready == 'true'
        with:
          # The export needs the content, the compiler and the tools. Historical run captures are
          # hundreds of MB and are not inputs.
          sparse-checkout: |
            .github
            game
            identity
            tools
      - uses: actions/setup-node@v5
        if: steps.configured.outputs.ready == 'true'
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        if: steps.configured.outputs.ready == 'true'
        run: npm ci --prefer-offline

      - name: Mask the export token
        if: steps.configured.outputs.ready == 'true'
        env:
          TOKEN: ${{ secrets.COREALM_CONTENT_READ_TOKEN }}
        # GitHub masks secrets already. This is belt and braces for anything derived from it.
        run: echo "::add-mask::$TOKEN"

      - name: Export the live server's content
        id: export
        if: steps.configured.outputs.ready == 'true'
        env:
          # The tool reads the token from here only. It refuses --token, because a command line is
          # visible to every process on the runner.
          COREALM_CONTENT_TOKEN: ${{ secrets.COREALM_CONTENT_READ_TOKEN }}
          SERVER_URL: ${{ steps.configured.outputs.server_url }}
          SUMMARY: ${{ runner.temp }}/export-summary.md
        run: npm run content:export:server -- --server "$SERVER_URL" --summary "$SUMMARY"

      - name: Check the exported content compiles
        if: steps.configured.outputs.ready == 'true'
        run: npm run content:check

      # An export that moves a spawn, a region or a creature's size stales the baked world, and the
      # pull request would then fail three artifact tests with "Stale world revision". Bake it here
      # so the export is green by construction. A GitHub runner bakes the release world in about
      # three minutes, and the bake is reproducible, so an export that cannot change baked bytes
      # rewrites nothing but the revision in `manifest.json`.
      - name: Install Chromium
        if: steps.configured.outputs.ready == 'true' && steps.export.outputs.changed == 'true'
        run: npx --no-install playwright install --with-deps chromium

      - name: Rebake whatever the export staled
        if: steps.configured.outputs.ready == 'true' && steps.export.outputs.changed == 'true'
        run: npm run world:build

      - name: Open or update the export pull request
        if: steps.configured.outputs.ready == 'true' && steps.export.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: content/live-export
          BASE: ${{ github.event_name == 'push' && github.ref_name || github.event.repository.default_branch }}
          SUMMARY: ${{ runner.temp }}/export-summary.md
          REVISION: ${{ steps.export.outputs.revision }}
          COLLECTIONS: ${{ steps.export.outputs.collections }}
          # Already checked for scheme and for characters a URL may not hold, in the first step.
          SERVER_URL: ${{ steps.configured.outputs.server_url }}
        run: |
          set -euo pipefail
          title="Promote content from ${SERVER_URL} into the base game (${REVISION:0:12})"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add game/content game/public/generated game/src/generated
          git commit --message "$title" --message "Collections: ${COLLECTIONS}" --message "$(cat "$SUMMARY")"
          # The branch is owned by this workflow and rebuilt from the default branch every run.
          git push --force origin "HEAD:refs/heads/$BRANCH"
          number="$(gh pr list --head "$BRANCH" --base "$BASE" --state open --json number --jq '.[0].number // ""')"
          if [ -z "$number" ]; then
            # A repository can forbid Actions from opening pull requests. The branch is pushed by now,
            # so say exactly what to switch on and where the comparison is.
            gh pr create --base "$BASE" --head "$BRANCH" --title "$title" --body-file "$SUMMARY" || {
              echo "::error title=Could not open the pull request::The export is on $BRANCH. Allow it under Settings > Actions > General > Allow GitHub Actions to create and approve pull requests, or open it by hand: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$BASE...$BRANCH"
              exit 1
            }
          else
            gh pr edit "$number" --title "$title" --body-file "$SUMMARY"
          fi

      - name: Say that nothing changed
        if: steps.configured.outputs.ready == 'true' && steps.export.outputs.changed != 'true'
        env:
          REVISION: ${{ steps.export.outputs.revision }}
        run: echo "::notice title=No content changes::This branch already holds the server's content at revision ${REVISION:0:12}."
