name: Game and guide

on:
  pull_request:
    paths:
      - "game/**"
      - "art/item-icons/**"
      - "docs/game/**"
      - "docs-site/**"
      - "tools/**"
      - "tests/**"
      - "astro.config.mjs"
      - "package.json"
      - "package-lock.json"
      - ".node-version"
      - ".npmrc"
      - "tsconfig.json"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "game/**"
      - "art/item-icons/**"
      - "docs/game/**"
      - "docs-site/**"
      - "tools/**"
      - "tests/**"
      - "astro.config.mjs"
      - "package.json"
      - "package-lock.json"
      - ".node-version"
      - ".npmrc"
      - "tsconfig.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GAME_BASE: /${{ github.event.repository.name }}/
  DOCS_BASE: /${{ github.event.repository.name }}/docs
  DOCS_SITE_URL: https://${{ github.repository_owner }}.github.io
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Includes asset checkout, guide image encoding, and Chromium acceptance.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # Historical run captures are hundreds of MB and are not build inputs.
          sparse-checkout: |
            .github
            art/item-icons
            docs/game
            docs-site
            game
            skills
            tests
            tools
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline
      - name: Typecheck, test, and build
        run: npm run check
      - name: Verify generated guide is committed
        run: git diff --exit-code -- docs/game
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Accept building features before final-world smoke
        run: npm run lab:test -- --shard building
      - name: Accept compatibility routing and mode navigation before final-world smoke
        run: npm run lab:test -- --shard navigation
      - name: Accept combat features before final-world smoke
        run: npm run lab:test -- --shard combat
      - name: Browser smoke test
        run: npm run smoke -- --run runs/corealm

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Asset checkout can consume half of the former five-minute job budget.
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      PUBLISH_GATES: "false"
    steps:
      - uses: actions/checkout@v5
        with:
          # Keep the 700+ MB historical screenshot archive out of build checkout.
          sparse-checkout: |
            .github
            art/item-icons
            docs/game
            docs-site
            game
            skills
            tests
            tools
      # Pages must be enabled once in repository settings with "GitHub Actions" as its source.
      - uses: actions/configure-pages@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline
      # Publish is currently build-only so a red lab shard cannot block a deploy. Flip
      # PUBLISH_GATES to "true" to restore the typecheck/test/lab/smoke gates below.
      - name: Build game and guide
        if: env.PUBLISH_GATES != 'true'
        run: npm run build && npm run docs:build
      - name: Typecheck, test, and build
        if: env.PUBLISH_GATES == 'true'
        run: npm run check
      - name: Verify generated guide is committed
        if: env.PUBLISH_GATES == 'true'
        run: git diff --exit-code -- docs/game
      - name: Install Chromium
        if: env.PUBLISH_GATES == 'true'
        run: npx --no-install playwright install --with-deps chromium
      - name: Accept building features before final-world smoke
        if: env.PUBLISH_GATES == 'true'
        run: npm run lab:test -- --shard building
      - name: Accept compatibility routing and mode navigation before final-world smoke
        if: env.PUBLISH_GATES == 'true'
        run: npm run lab:test -- --shard navigation
      - name: Accept combat features before final-world smoke
        if: env.PUBLISH_GATES == 'true'
        run: npm run lab:test -- --shard combat
      - name: Browser smoke test
        if: env.PUBLISH_GATES == 'true'
        run: npm run smoke -- --run runs/corealm

      - name: Stage game and guide
        shell: bash
        run: |
          mkdir -p pages-dist/docs
          cp -R game/dist/. pages-dist/
          cp -R dist/. pages-dist/docs/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages-dist
      - id: deployment
        uses: actions/deploy-pages@v5
