name: Game and guide

on:
  pull_request:
    paths:
      - "game/**"
      - "art/item-icons/**"
      - "devdocs/**"
      - "identity/**"
      - "game/content/**"
      - "tools/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".node-version"
      - ".npmrc"
      - "tsconfig.json"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "game/**"
      - "art/item-icons/**"
      - "devdocs/**"
      - "identity/**"
      - "game/content/**"
      - "tools/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".node-version"
      - ".npmrc"
      - "tsconfig.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GAME_BASE: /${{ github.event.repository.name }}/
  DOCS_BASE: /${{ github.event.repository.name }}/docs

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Checkout, install, Chromium, the whole suite, the game and guide builds and two lab shards.
    # The suite alone reaches the eleven-minute mark on a shared runner.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          # Historical run captures are hundreds of MB and are not build inputs.
          sparse-checkout: |
            .github
            art/biome-creatures
            art/fairy-population/textures/generated
            art/item-icons
            art/rebuild/candidates/finish-cave-source
            art/rebuild/candidates/finish-motion
            assets/art/regional-bosses
            devdocs
            docs/game
            game
            identity
            tests
            tools
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline
      # Release world baking requires Chromium during the build itself.
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Typecheck, test, and build
        run: npm run check
      # COREALM_LAB_CI scales the readiness wait and the wall-clock ceiling for a shared hosted runner
      # with no GPU, and nothing else: every gameplay budget inside the shard stays at the value it
      # has on a developer machine. tools/feature-lab-test.ts carries the measurements.
      - name: Accept building features
        env:
          COREALM_LAB_CI: "1"
        run: npm run lab:test -- --shard building
      - name: Accept combat features
        env:
          COREALM_LAB_CI: "1"
        run: npm run lab:test -- --shard combat

  # The final-world smoke test needs a GPU, so it cannot run beside `verify` on `ubuntu-latest`.
  #
  # Measured 2026-09-21 on a GPU workstation: `npm run smoke -- --run runs/corealm` fails at
  # `waitForSimulationTick` after 8 s under the SwiftShader rasteriser that headless Chromium falls
  # back to, and passes all twelve checks with `--hardware`. The authored world is not a budget
  # problem there — software rendering never reaches the first simulation tick at all. A hosted
  # runner has no GPU to give it, so this job stays skipped and says so, instead of being deleted
  # or wrapped in a `continue-on-error` that would report green over a gate nobody ran.
  #
  # Run it on the hardware workstation before merging anything that touches boot, rendering or
  # navigation:  npm run smoke -- --run runs/corealm --hardware
  #
  # To turn it on, set the repository variable COREALM_GPU_RUNNER to the label of a self-hosted
  # runner with a GPU. Nothing else has to change.
  smoke:
    name: Browser smoke test (needs a GPU runner)
    if: github.event_name == 'pull_request' && vars.COREALM_GPU_RUNNER != ''
    # The fallback is never used: `if` skips the job whenever the variable is empty. It is here so
    # `runs-on` always resolves to a real label rather than an empty string.
    runs-on: ${{ vars.COREALM_GPU_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # Historical run captures are hundreds of MB and are not build inputs.
          sparse-checkout: |
            .github
            art/biome-creatures
            art/fairy-population/textures/generated
            art/item-icons
            art/rebuild/candidates/finish-cave-source
            art/rebuild/candidates/finish-motion
            assets/art/regional-bosses
            devdocs
            docs/game
            game
            identity
            tests
            tools
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Browser smoke test
        run: npm run smoke -- --run runs/corealm --hardware

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Asset checkout can consume half of the former five-minute job budget.
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      PUBLISH_GATES: "false"
    steps:
      - uses: actions/checkout@v5
        with:
          # Keep the 700+ MB historical screenshot archive out of build checkout.
          sparse-checkout: |
            .github
            art/biome-creatures
            art/fairy-population/textures/generated
            art/item-icons
            art/rebuild/candidates/finish-cave-source
            art/rebuild/candidates/finish-motion
            assets/art/regional-bosses
            devdocs
            docs/game
            game
            identity
            tests
            tools
      # Pages must be enabled once in repository settings with "GitHub Actions" as its source.
      - uses: actions/configure-pages@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline
      # Required for release world baking even when acceptance gates are disabled.
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      # Publish is currently build-only so a red lab shard cannot block a deploy. Flip
      # PUBLISH_GATES to "true" to restore the typecheck/test/lab/smoke gates below.
      - name: Build game and guide
        if: env.PUBLISH_GATES != 'true'
        run: npm run build && npm run guide:build
      - name: Typecheck, test, and build
        if: env.PUBLISH_GATES == 'true'
        run: npm run check
      - name: Accept building features
        if: env.PUBLISH_GATES == 'true'
        env:
          COREALM_LAB_CI: "1"
        run: npm run lab:test -- --shard building
      - name: Accept combat features
        if: env.PUBLISH_GATES == 'true'
        env:
          COREALM_LAB_CI: "1"
        run: npm run lab:test -- --shard combat
      # No smoke step here: it needs a GPU this runner does not have. See the `smoke` job above.

      - name: Stage game and guide
        shell: bash
        run: |
          mkdir -p pages-dist/docs
          cp -R game/dist/. pages-dist/
          cp -R dist/. pages-dist/docs/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages-dist
      - id: deployment
        uses: actions/deploy-pages@v5
