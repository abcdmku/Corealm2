<!doctype html><html><head><meta charset="utf-8"><title>Hoofed source geometry review</title><style>body{margin:0;background:#303b40;color:#efeadc;font:16px system-ui}canvas{display:block}#label{position:absolute;left:20px;top:16px}button,select{font:inherit;margin:0 8px;padding:4px 10px}</style><script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js"}}</script></head><body><div id="label">Source geometry review <select id="species"></select><select id="clip"><option>Rest</option><option>Idle</option><option>Walk</option><option>Run</option><option>Attack</option><option>Hit</option><option>Death</option></select></div><script type="module">
import * as THREE from 'three';import {SPECIES,buildSpecies} from '../hoofed.mjs';
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(1300,1000);renderer.setPixelRatio(1);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#34454a');scene.add(new THREE.HemisphereLight(0xd7e7f3,0x534738,2.1));const light=new THREE.DirectionalLight(0xffe0b3,3.8);light.position.set(4,7,3);light.castShadow=true;light.shadow.mapSize.set(2048,2048);Object.assign(light.shadow.camera,{left:-5,right:5,top:5,bottom:-5});scene.add(light);const fill=new THREE.DirectionalLight(0xa1c6dc,1.5);fill.position.set(-4,2,-4);scene.add(fill);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:0x697274,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.01;ground.receiveShadow=true;scene.add(ground);
const camera=new THREE.PerspectiveCamera(35,1.3,.01,100);let model,mixer,clips;
window.pick=async(id)=>{if(model)scene.remove(model);const result=await buildSpecies(id);model=result.object;clips=result.clips;scene.add(model);mixer=new THREE.AnimationMixer(model);window.current=result;document.querySelector('#species').value=id;window.pose('Rest',0);};
window.pose=(clip,time=0)=>{mixer.stopAllAction();if(clip!=='Rest'){mixer.clipAction(clips.find(c=>c.name===clip)).play();mixer.setTime(time);}else model.traverse(o=>{if(o.isSkinnedMesh)o.skeleton.pose();});document.querySelector('#clip').value=clip;renderer.render(scene,camera);};
window.angle=(x=4,y=2.8,z=5,target=[0,1.3,.15])=>{camera.position.set(x,y,z);camera.lookAt(...target);renderer.render(scene,camera);};
window.angle(4,2.8,5);for(const id of SPECIES)document.querySelector('#species').insertAdjacentHTML('beforeend',`<option>${id}</option>`);document.querySelector('#species').onchange=e=>window.pick(e.target.value);document.querySelector('#clip').onchange=e=>window.pose(e.target.value,.3);await window.pick(SPECIES[0]);window.ready=true;
</script></body></html>
